{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
    <div class="fly-gradient px-8 py-6 text-center text-white">
        <span class="bg-sky-500 text-xs font-extrabold px-2.5 py-1 rounded uppercase tracking-widest">Plataforma Ejecutiva</span>
        <h1 class="text-2xl font-extrabold uppercase tracking-wider mt-2">FLY LOGISTIC</h1>
        <p class="text-sky-200 text-xs mt-1">Aero Command Center &middot; Gestión Nacional e Internacional</p>
    </div>

    <div class="p-8">
        {% if error %}
        <div class="bg-red-50 border-l-4 border-red-600 text-red-700 p-3.5 mb-6 text-sm rounded">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="/login" class="space-y-5">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Usuario Corporativo</label>
                <input type="text" name="username" value="{{ username }}" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#002060] focus:outline-none" required autofocus>
            </div>
            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Contraseña</label>
                <input type="password" name="password" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-[#002060] focus:outline-none" required>
            </div>
            <div class="flex items-center justify-between text-xs">
                <a href="/olvide" class="text-blue-700 hover:underline font-semibold">Restablecer clave (Directivos)</a>
                <a href="/registro" class="text-slate-600 hover:underline font-medium">Registrar cuenta de asesor →</a>
            </div>
            <button type="submit" class="w-full py-3 px-4 rounded-lg shadow text-sm font-bold text-white fly-bg fly-hover transition uppercase tracking-wider">
                Ingresar al Centro de Mando
            </button>
        </form>
    </div>
</div>
{% endblock %}
